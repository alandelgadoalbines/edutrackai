name: Build Pachacutin Talentos APK

on:
  push:
    branches:
      - build/pachacutin-talentos-20260803
    paths:
      - 'pachacutin-build/**'
      - '.github/workflows/build-pachacutin-talentos.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'pachacutin-build/**'
      - '.github/workflows/build-pachacutin-talentos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android source project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            pachacutin-build/source.b64.part00 \
            pachacutin-build/source.b64.part01 \
            pachacutin-build/source.b64.part02 \
            pachacutin-build/source.b64.part03a \
            pachacutin-build/source.b64.part03b \
            pachacutin-build/source.b64.part03c \
            pachacutin-build/source.b64.part03d \
            pachacutin-build/source.b64.part04 \
            > /tmp/pachacutin-source.b64

          test "$(wc -c < /tmp/pachacutin-source.b64)" -eq 33880
          echo '5c9b887cd6f295d02f46247bd4445cbb72461665f48ba37490fb97ebff5433d1  /tmp/pachacutin-source.b64' | sha256sum -c -

          base64 --decode /tmp/pachacutin-source.b64 > /tmp/pachacutin-source.zip
          echo '2ad791f1472c390410b8768118d7dad2a781bb3614ba58bd3045e6c8ad4c3321  /tmp/pachacutin-source.zip' | sha256sum -c -
          unzip -t /tmp/pachacutin-source.zip >/dev/null
          unzip -q /tmp/pachacutin-source.zip -d "$GITHUB_WORKSPACE/build-src"
          test -f "$GITHUB_WORKSPACE/build-src/Pachacutin_Talentos_Android/settings.gradle"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/build-src/Pachacutin_Talentos_Android" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Prepare deliverables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/PACHACUTIN_Talentos_Bluetooth.apk
          sha256sum dist/PACHACUTIN_Talentos_Bluetooth.apk > dist/PACHACUTIN_Talentos_Bluetooth.apk.sha256
          unzip -t dist/PACHACUTIN_Talentos_Bluetooth.apk >/dev/null

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PACHACUTIN-Talentos-Android
          path: dist/*
          if-no-files-found: error
          retention-days: 7
